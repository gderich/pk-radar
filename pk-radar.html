<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PK Radar – Tibia</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--bd:#2a2f3a;--tx:#e6e8ee;--mu:#8b93a5;--ac:#e5484d;--ok:#3ecf8e}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f5f7;--card:#fff;--bd:#d9dce3;--tx:#1a1d24;--mu:#666e80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;padding:12px;max-width:1100px;margin:auto}
h1{font-size:18px;margin:0}h2{font-size:14px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0}
input,select,textarea,button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 9px;font:inherit}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:120px}
.dot{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block}.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.ch{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--bd);flex-wrap:wrap}.ch:first-of-type{border:0}
.mu{color:var(--mu);font-size:12px}a{color:var(--ac)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.hm{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:10px;color:var(--mu)}.hm i{aspect-ratio:1;border-radius:2px;background:var(--ac)}
.alert{padding:5px 8px;border-left:3px solid var(--bd);margin:3px 0}.alert.mass{border-color:var(--ac);background:rgba(229,72,77,.12);font-weight:600}.alert.in{border-color:var(--ok)}
.alert.death{border-color:var(--ac)}.alert.lv{border-color:#f5a524}.tag{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--bd)}
</style></head><body>
<div class="row"><h1 class="grow">🎯 PK Radar</h1><span id="st" class="mu"></span><button id="pb" class="p">▶ Iniciar monitor</button></div>

<div class="card"><h2>Adicionar</h2>
<div class="row"><input id="nm" class="grow" placeholder="Nome do char (ou vários, um por linha)"><input id="pn" list="pl" class="grow" placeholder="Pertence a (pessoa) — vazio = nova pessoa"><datalist id="pl"></datalist>
<label class="mu"><input type="checkbox" id="al" checked> puxar alts visíveis</label><button id="ad" class="p">Adicionar</button><button id="sd">Importar lista VIP</button></div>
<div class="mu" style="margin-top:6px" id="msg">Ao adicionar, busco o char na TibiaData e, se a conta for pública, já importo os outros chars da conta.</div></div>

<div class="card"><h2>Alertas</h2><div class="row" style="margin-bottom:6px"><select id="ff"><option value="">Todos</option><option value="death">Mortes</option><option value="pk">Só mortes p/ players</option><option value="in">Logins</option><option value="mass">Mass log</option><option value="lv">Level up</option></select><input id="fq" class="grow" placeholder="Filtrar por nome, data ou hora…"></div><div id="al2" style="max-height:220px;overflow:auto"></div></div>

<div class="card"><h2>Horários (frequência online)</h2><div class="row"><select id="hp"></select><span class="mu">horário do seu navegador · quanto mais forte a cor, mais tempo online</span></div><div id="hm" style="margin-top:8px"></div></div>

<div class="card"><h2>Pessoas & chars</h2><div id="pp" class="grid"></div></div>

<div class="card"><h2>Config</h2><div class="row">
<span class="mu">Intervalo (s)</span><input id="iv" type="number" min="30" style="width:70px">
<span class="mu">Mass log:</span><input id="mn" type="number" min="2" style="width:55px"><span class="mu">chars em</span><input id="mm" type="number" min="1" style="width:55px"><span class="mu">min</span>
<label class="mu"><input type="checkbox" id="nt"> notificações/som</label>
<button id="gh">☁ Backup na nuvem</button><span id="cl2" class="mu"></span><button id="ex">Exportar</button><button id="im">Importar</button><button id="cl">Limpar histórico</button></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={cfg:{iv:60,mn:3,mm:5,nt:true},people:[],chars:[],events:[],heat:{}},online=new Set(),prev=null,timer=null,lastMass=0,lastPoll=null;
try{const d=JSON.parse(localStorage.getItem('pkradar')||'null');if(d)S=Object.assign(S,d)}catch(e){}
const persist=()=>{try{localStorage.setItem('pkradar',JSON.stringify(S))}catch(e){}};
const save=()=>{S.upd=Date.now();persist();schedPush()};
const API='https://api.tibiadata.com/v4/';
const lk=n=>n.toLowerCase();
async function api(p){const r=await fetch(API+p);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function person(name){let p=S.people.find(x=>lk(x.name)==lk(name));if(!p){p={id:'p'+Date.now()+Math.random().toString(36).slice(2,5),name};S.people.push(p)}return p}
async function addChar(n,pid,alts){
 const j=await api('character/'+encodeURIComponent(n)),c=j.character.character;
 if(!c||!c.name)throw new Error('não encontrado: '+n);
 const put=(o,w)=>{if(!S.chars.find(x=>lk(x.n)==lk(o.name)))S.chars.push({n:o.name,pid,world:o.world||w,lvl:o.level,voc:o.vocation,guild:o.guild&&o.guild.name})};
 put(c);let extra=0;
 if(alts)(j.character.other_characters||[]).forEach(o=>{if(!S.chars.find(x=>lk(x.n)==lk(o.name))){S.chars.push({n:o.name,pid,world:o.world});extra++}});
 return extra}
$('#ad').onclick=async()=>{
 const names=$('#nm').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!names.length)return;
 $('#ad').disabled=true;let out=[];
 for(const n of names){try{const pn=$('#pn').value.trim()||n;const p=person(pn);const e=await addChar(n,p.id,$('#al').checked);out.push('✔ '+n+(e?` (+${e} alts)`:''))}catch(e){out.push('✖ '+n+': '+e.message)}}
 $('#msg').textContent=out.join(' · ');$('#nm').value='';$('#pn').value='';$('#ad').disabled=false;save();render();poll()};
function alertAdd(t,type,extra){S.events.unshift(Object.assign({t:Date.now(),m:t,k:type},extra));S.events=S.events.slice(0,2000);
 if(S.cfg.nt&&type!='out'&&type!='lv'){try{new Notification('PK Radar',{body:t})}catch(e){}if(type=='mass')beep(3);else beep(1)}}
function beep(n){try{const a=new AudioContext();for(let i=0;i<n;i++){const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=n>1?520:880;g.gain.value=.08;o.start(a.currentTime+i*.25);o.stop(a.currentTime+i*.25+.15)}}catch(e){}}
async function poll(){
 const worlds=[...new Set(S.chars.map(c=>c.world).filter(Boolean))];if(!worlds.length)return;
 const now=new Set(),ok=[];
 for(const w of worlds){try{const j=await api('world/'+encodeURIComponent(w));(j.world.online_players||[]).forEach(p=>now.add(lk(p.name)));ok.push(w)}catch(e){$('#cl2').textContent=S.gh&&S.gh.token?(S.gh.err?'☁ erro: '+S.gh.err:S.gh.ok?'☁ salvo '+new Date(S.gh.ok).toLocaleTimeString():'☁ configurado'):'⚠ sem backup na nuvem';
 $('#st').textContent='erro API: '+e.message}}
 if(!ok.length)return;
 const tracked=S.chars.filter(c=>ok.includes(c.world)),d=new Date(),cell=d.getDay()*24+d.getHours();
 tracked.forEach(c=>{const on=now.has(lk(c.n)),was=prev?prev.has(lk(c.n)):on,pn=(S.people.find(p=>p.id==c.pid)||{}).name;
  if(on){(S.heat[c.pid]=S.heat[c.pid]||new Array(168).fill(0))[cell]++}
  if(prev&&on&&!was)alertAdd(`🟢 ${c.n} logou (${pn})`,'in',{c:c.n,pid:c.pid});
  if(prev&&!on&&was)alertAdd(`⚪ ${c.n} deslogou (${pn})`,'out',{c:c.n,pid:c.pid})});
 // mass log: chars distintos logando na janela
 const win=Date.now()-S.cfg.mm*60000,rec=new Set(S.events.filter(e=>e.k=='in'&&e.t>=win).map(e=>e.c));
 if(rec.size>=S.cfg.mn&&Date.now()-lastMass>S.cfg.mm*60000){lastMass=Date.now();alertAdd(`🚨 MASS LOG: ${rec.size} chars logaram em ${S.cfg.mm} min — ${[...rec].join(', ')}`,'mass')}
 prev=now;online=now;lastPoll=new Date();save();render()}
$('#pb').onclick=()=>{if(timer){clearInterval(timer);clearInterval(rtimer);timer=null;$('#pb').textContent='▶ Iniciar monitor'}else{try{Notification.requestPermission()}catch(e){}prev=null;poll();timer=setInterval(poll,Math.max(30,S.cfg.iv)*1000);refresh();rtimer=setInterval(refresh,600000);$('#pb').textContent='⏸ Monitorando…'}};
function render(){
 $('#pl').innerHTML=S.people.map(p=>`<option value="${esc(p.name)}">`).join('');
 const sel=$('#hp').value;$('#hp').innerHTML=S.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');if(sel)$('#hp').value=sel;
 $('#st').textContent=(timer?'ativo · ':'parado · ')+S.chars.length+' chars'+(lastPoll?' · última checagem '+lastPoll.toLocaleTimeString():'');
 const fq=$('#fq').value.toLowerCase(),ff=$('#ff').value;
 $('#al2').innerHTML=S.events.filter(e=>(!ff||(ff=='pk'?(e.k=='death'&&/\[PK\]/.test(e.m)):e.k==ff))&&(!fq||(e.m+' '+new Date(e.t).toLocaleString()).toLowerCase().includes(fq))).slice(0,150).map(e=>`<div class="alert ${e.k}">${new Date(e.t).toLocaleString()} — ${esc(e.m)}</div>`).join('')||'<span class="mu">Sem eventos ainda.</span>';
 $('#pp').innerHTML=S.people.map(p=>{const cs=S.chars.filter(c=>c.pid==p.id),n=cs.filter(c=>online.has(lk(c.n))).length;
  return `<div class="card" style="margin:0"><div class="row"><b class="grow">${esc(p.name)}</b><span class="tag">${n}/${cs.length} on</span><button data-a="rp" data-id="${p.id}">✎</button><button data-a="dp" data-id="${p.id}">🗑</button></div>
  <input data-a="note" data-id="${p.id}" value="${esc(p.note||'')}" placeholder="notas (main? vocação, time…)" style="width:100%;margin:6px 0">`+
  cs.map(c=>`<div class="ch"><span class="dot ${online.has(lk(c.n))?'on':''}"></span><b>${esc(c.n)}</b><span class="mu">${c.lvl||''} ${esc(c.voc||'')} · ${esc(c.world||'')}${c.guild?' · '+esc(c.guild):''}${c.last?' · últ. login '+new Date(c.last).toLocaleDateString():''}</span><span class="grow"></span>
  <a target="_blank" href="https://www.tibiaring.com/char.php?lang=pt&char=${encodeURIComponent(c.n)}">Ring</a>
  <a target="_blank" href="https://guildstats.eu/character?nick=${encodeURIComponent(c.n)}">GStats</a>
  <a target="_blank" href="https://www.tibiastalker.pl/" data-a="cp" data-n="${esc(c.n)}" title="copia o nome e abre o Stalker">Stalker</a>
  <select data-a="mv" data-n="${esc(c.n)}"><option>mover…</option>${S.people.filter(x=>x.id!=p.id).map(x=>`<option value="${x.id}">→ ${esc(x.name)}</option>`).join('')}</select><button data-a="dc" data-n="${esc(c.n)}">✕</button></div>`).join('')+`</div>`}).join('')||'<span class="mu">Adicione o primeiro char acima.</span>';
 heat()}
function heat(){const h=S.heat[$('#hp').value];if(!h){$('#hm').innerHTML='<span class="mu">Sem dados — deixe o monitor rodando.</span>';return}
 const mx=Math.max(...h,1),D=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];let s='<div></div>'+[...Array(24).keys()].map(i=>`<div>${i}</div>`).join('');
 for(let d=0;d<7;d++){s+=`<div>${D[d]}</div>`;for(let i=0;i<24;i++){const v=h[d*24+i];s+=`<i title="${D[d]} ${i}h: ${v}" style="opacity:${v?.12+.88*v/mx:.06}"></i>`}}$('#hm').innerHTML=`<div class="hm">${s}</div>`}
$('#hp').onchange=heat;
document.addEventListener('click',e=>{const t=e.target,a=t.dataset.a;if(!a)return;
 if(a=='dc'){S.chars=S.chars.filter(c=>c.n!=t.dataset.n)}
 if(a=='dp'&&confirm('Remover pessoa e seus chars?')){S.chars=S.chars.filter(c=>c.pid!=t.dataset.id);S.people=S.people.filter(p=>p.id!=t.dataset.id)}
 if(a=='rp'){const p=S.people.find(p=>p.id==t.dataset.id),n=prompt('Novo nome:',p.name);if(n)p.name=n}
 if(a=='cp'){try{navigator.clipboard.writeText(t.dataset.n)}catch(x){}return}
 save();render()});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;if(a=='mv'){S.chars.find(c=>c.n==t.dataset.n).pid=t.value;save();render()}if(a=='note'){S.people.find(p=>p.id==t.dataset.id).note=t.value;save()}});
const cfg=()=>{$('#iv').value=S.cfg.iv;$('#mn').value=S.cfg.mn;$('#mm').value=S.cfg.mm;$('#nt').checked=S.cfg.nt};cfg();
['iv','mn','mm'].forEach(k=>$('#'+k).onchange=e=>{S.cfg[k]=+e.target.value;save()});$('#nt').onchange=e=>{S.cfg.nt=e.target.checked;save()};
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pub())],{type:'application/json'}));a.download='pk-radar.json';a.click()};
$('#im').onclick=()=>{const i=document.createElement('input');i.type='file';i.onchange=async()=>{merge(JSON.parse(await i.files[0].text()));save();cfg();render()};i.click()};
$('#cl').onclick=()=>{if(confirm('Apagar eventos e horários?')){S.events=[];S.heat={};save();render()}};
var rtimer,busy=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SEED=["Gjdebz","Elmuerte","Royal Creeds","Villas Creeds","Lord Lusius","Guedes Proxy","Jean Pusheen","King of Tretas","Rocha Vimprorush","Arcon Dusing","Malokeirah","Repair Softboots","Paldoni Karke","Viciousback","Ro Od Formidavel","Awesome Ideals","Salbaria Syfaladrel","Pak Explicit","Umobuga Feiditau","Xxoxii","Caneva Is Back","Blaze Lostshell","Levity Naverande","No Pelu","Adwino Rhys","Lkbomb","Tehde Leteo","Harumasz","Tiger Shadow","Prensado Xuxuzao","Xxoxi","Muita Agua Xixica","Brazillian Jiu Jitsu","Tomasuakuu","Lina Semneura","Valheu","Oisoueudenovo","Atiradora de Dardos","Rhashid","Fjdebzz","Hjdebz","Lebesquedoh"];
async function seed(){S.seeded=1;let ok=0,bad=[];
 for(const n of SEED){if(S.chars.some(c=>lk(c.n)==lk(n)))continue;
  try{const p=person(n);await addChar(n,p.id,true);ok++}catch(e){bad.push(n);S.people=S.people.filter(x=>S.chars.some(c=>c.pid==x.id))}
  $('#msg').textContent=`Importando… ${ok+bad.length}/${SEED.length}`;save();render();await sleep(250)}
 $('#msg').textContent=`Importados ${ok}. `+(bad.length?'Falharam: '+bad.join(', '):'')+' Buscando histórico de mortes/levels…';await refresh();$('#msg').textContent='Pronto. Clique em ▶ Iniciar monitor.'}
function parseKillers(d){if(d.killers&&d.killers.length)return d.killers.map(x=>({n:x.name,p:!!x.player}));const r=d.reason||'',i=r.indexOf(' by ');if(i<0)return[];return r.slice(i+4).split(/, | and /).map(x=>x.trim()).filter(Boolean).map(x=>({n:x,p:/^[A-Z]/.test(x)}))}
async function refresh(){if(busy)return;busy=true;
 for(const c of S.chars.slice()){try{const j=await api('character/'+encodeURIComponent(c.n)),ch=j.character.character,first=!c.seen,old=c.lvl,pn=(S.people.find(p=>p.id==c.pid)||{}).name;
  c.lvl=ch.level;c.voc=ch.vocation;c.guild=ch.guild&&ch.guild.name;c.last=ch.last_login;
  if(!first&&old&&ch.level>old)alertAdd(`⬆️ ${c.n} subiu ${old}→${ch.level} (${pn})`,'lv',{c:c.n});
  const seen=c.seen||[];
  (j.character.deaths||[]).forEach(d=>{const k=d.time+'|'+d.level;if(seen.includes(k))return;seen.push(k);
   const kl=parseKillers(d),ks=kl.map(x=>x.n),pk=kl.some(x=>x.p),tm=ks.filter(x=>S.chars.some(z=>lk(z.n)==lk(x)));
   const m=`☠️ ${c.n} (lvl ${d.level}, ${pn}) morreu p/ ${ks.join(', ')||'?'}${pk?' [PK]':''}${tm.length?' — 👥 da lista: '+tm.join(', '):''}`;
   if(first)S.events.push({t:Date.parse(d.time)||0,m,k:'death',c:c.n});else alertAdd(m,'death',{c:c.n})});
  c.seen=seen.slice(-40)}catch(e){}
  await sleep(200)}
 S.events.sort((a,b)=>b.t-a.t);S.events=S.events.slice(0,2000);busy=false;save();render()}
$('#sd').onclick=seed;$('#ff').onchange=$('#fq').oninput=render;
const pub=()=>{const o=Object.assign({},S);delete o.gh;return o};
let pushT;function schedPush(){if(S.gh&&S.gh.token){clearTimeout(pushT);pushT=setTimeout(push,8000)}}
const GH=()=>({Authorization:'Bearer '+S.gh.token,Accept:'application/vnd.github+json','Content-Type':'application/json'});
async function push(){try{const body={files:{'pk-radar.json':{content:JSON.stringify(pub())}}};let r;
 if(S.gh.id)r=await fetch('https://api.github.com/gists/'+S.gh.id,{method:'PATCH',headers:GH(),body:JSON.stringify(body)});
 else r=await fetch('https://api.github.com/gists',{method:'POST',headers:GH(),body:JSON.stringify(Object.assign({description:'pk-radar backup',public:false},body))});
 if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();S.gh.id=j.id;S.gh.ok=Date.now();S.gh.err=null}catch(e){S.gh.err=e.message}persist();render()}
async function pull(){try{const r=await fetch('https://api.github.com/gists/'+S.gh.id,{headers:GH()});if(!r.ok)throw new Error('HTTP '+r.status);
 const f=(await r.json()).files['pk-radar.json'];let t=f.content;if(f.truncated)t=await(await fetch(f.raw_url)).text();merge(JSON.parse(t));S.gh.err=null}catch(e){S.gh.err='pull '+e.message}persist();cfg();render()}
function merge(R){if(!R)return;const nw=(R.upd||0)>(S.upd||0);
 (R.people||[]).forEach(p=>{const l=S.people.find(x=>x.id==p.id);if(!l)S.people.push(p);else if(nw){l.name=p.name;l.note=p.note}});
 (R.chars||[]).forEach(c=>{const l=S.chars.find(x=>lk(x.n)==lk(c.n));if(!l)S.chars.push(c);else{const sn=[...new Set([...(l.seen||[]),...(c.seen||[])])];if(nw)Object.assign(l,c);l.seen=sn}});
 const ek=e=>e.t+'|'+e.m,have=new Set(S.events.map(ek));(R.events||[]).forEach(e=>{if(!have.has(ek(e)))S.events.push(e)});S.events.sort((a,b)=>b.t-a.t);S.events=S.events.slice(0,2000);
 Object.entries(R.heat||{}).forEach(([k,v])=>{const h=S.heat[k]=S.heat[k]||new Array(168).fill(0);v.forEach((x,i)=>h[i]=Math.max(h[i],x))});
 if(nw&&R.cfg)Object.assign(S.cfg,R.cfg);S.seeded=S.seeded||R.seeded;S.upd=Math.max(S.upd||0,R.upd||0)}
$('#gh').onclick=async()=>{const t=prompt('Cole um token do GitHub (classic, só com o escopo "gist"):');if(!t)return;
 const id=(prompt('ID de um gist já existente (deixe vazio para criar um novo):')||'').trim();S.gh={token:t.trim(),id:id||null};
 if(id){if(!confirm('Este aparelho vai adotar os dados do gist (os locais são substituídos). Continuar?')){S.gh=null;return}S.people=[];S.chars=[];S.events=[];S.heat={};S.upd=0;await pull()}
 await push()};
if(S.gh&&S.gh.token&&S.gh.id)pull();
render();if(!S.seeded&&!S.chars.length)seed();
</script></body></html>
