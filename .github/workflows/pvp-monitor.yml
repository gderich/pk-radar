name: PK Radar - PvP Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pk-radar-pvp-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Validar segredo do monitor
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Adicione CRON_SECRET em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Reconciliação TibiaData
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body             --retry 2             --retry-delay 3             --max-time 90             -X POST "https://pk-radar.vercel.app/api/monitor-tick"             -H "Authorization: Bearer $CRON_SECRET"             -H "Content-Type: application/json"             --data '{}'

      - name: Kills diretas pelo TibiaRing
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PK_RADAR_BASE_URL: https://pk-radar.vercel.app
        run: node scripts/ring-kill-monitor.mjs
