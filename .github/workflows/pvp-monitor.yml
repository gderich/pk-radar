name: PK Radar - PvP Monitor

on:
  schedule:
    # Fallback autônomo. O monitor principal pode ser chamado externamente a cada 1 minuto.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pk-radar-pvp-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Disparar monitor server-side
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Adicione CRON_SECRET em Settings > Secrets and variables > Actions."
            exit 1
          fi

          curl --fail-with-body             --retry 3             --retry-delay 5             --max-time 90             -X POST "https://pk-radar.vercel.app/api/monitor-tick"             -H "Authorization: Bearer $CRON_SECRET"             -H "Content-Type: application/json"             --data '{}'

      - name: Limpar mapeamento inválido
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body             --retry 2             --retry-delay 3             --max-time 90             -X POST "https://pk-radar.vercel.app/api/mapping-cleanup"             -H "Authorization: Bearer $CRON_SECRET"             -H "Content-Type: application/json"             --data '{}'
