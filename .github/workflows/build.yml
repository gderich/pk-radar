name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check worker/monitor.mjs
      - run: node --check worker/sources.mjs
      - run: node --check worker/pvp-watch.mjs
      - run: node --check shared/pvp-scan.mjs
      - run: node --check api/pvp-watch.js
      - run: node --check api/pvp-pulse.js
      - run: node --check api/monitor-tick.js
      - run: node --check api/monitor-targets.js
      - run: node --check api/ring-ingest.js
      - run: node --check scripts/ring-kill-monitor.mjs
      - run: node --check api/ring-sync.js
      - run: node --check api/public-who.js
      - run: node --check api/public-data.js
      - name: TibiaRing acessível no runner
        run: |
          code=$(curl -L -A "Mozilla/5.0 (compatible; PK-Radar-CI/1.0)" --max-time 25 -sS -o /tmp/ring.html -w "%{http_code}" "https://www.tibiaring.com/char.php?c=Be%20Hammer&lang=en")
          echo "TibiaRing HTTP $code"
          test "$code" = "200"
          grep -qi "combat history" /tmp/ring.html
      - run: npm run build
