name: One-time mapping cleanup v6

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one-time cleanup v6
        run: |
          sleep 35
          curl --fail-with-body --retry 3 --retry-delay 4 --max-time 120             "https://pk-radar.vercel.app/api/one-time-cleanup?confirm=v6"
